
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Taskly — To Do</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #101014;
    --card: #19191f;
    --card-hover: #222229;
    --text: #f5f5f7;
    --muted: #858591;
    --accent: #a78bfa;
    --border: #292930;
    --green: #62d6a5;
    --red: #f47777;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 24px 20px 110px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: var(--accent);
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 14px;
    background: #292332;
    display: grid;
    place-items: center;
    color: var(--accent);
    font-weight: 700;
}

/* GREETING */

.greeting {
    margin-bottom: 25px;
}

.greeting .date {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
}

.greeting h1 {
    font-size: 28px;
    letter-spacing: -1px;
}

.greeting p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 7px;
}

/* STATISTICS */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
}

.stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
}

.stat-label {
    color: var(--muted);
    font-size: 12px;
}

.stat-number {
    font-size: 27px;
    font-weight: 750;
    margin-top: 10px;
}

.stat-card.completed .stat-number {
    color: var(--green);
}

/* SECTION */

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.section-header h2 {
    font-size: 18px;
    letter-spacing: -.4px;
}

.section-header a {
    color: var(--accent);
    font-size: 13px;
    text-decoration: none;
}

/* TASKS */

.tasks {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.task {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 13px;
}

.task-check {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: 2px solid #555563;
    border-radius: 8px;
}

.task.done .task-check {
    background: var(--green);
    border-color: var(--green);
}

.task.done .task-check::after {
    content: "✓";
    display: block;
    color: #101014;
    text-align: center;
    font-weight: bold;
    line-height: 18px;
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-size: 14px;
    font-weight: 650;
}

.task-description {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
}

.task.done .task-title {
    text-decoration: line-through;
    color: var(--muted);
}

.task-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 9px;
}

.priority {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    background: #352329;
    color: #f28c96;
}

.task-time {
    font-size: 11px;
    color: var(--muted);
}

.task-menu {
    color: var(--muted);
    font-size: 20px;
    letter-spacing: 2px;
}

/* ADD BUTTON */

.add-button {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 440px;
    padding: 17px;
    border: none;
    border-radius: 16px;
    background: var(--accent);
    color: #17121f;
    font-size: 15px;
    font-weight: 750;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
}

/* PAGE TITLE */

.page-title {
    font-size: 27px;
    letter-spacing: -1px;
    margin-bottom: 8px;
}

.page-subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 25px;
}

/* FORM */

.form-group {
    margin-bottom: 19px;
}

.form-group label {
    display: block;
    font-size: 13px;
    margin-bottom: 9px;
    color: #d2d2d9;
}

.form-control {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 15px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
}

.form-control:focus {
    border-color: var(--accent);
}

textarea.form-control {
    resize: none;
    min-height: 100px;
}

select.form-control {
    appearance: none;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.primary-button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #17121f;
    font-size: 14px;
    font-weight: 750;
    margin-top: 10px;
}

.secondary-button {
    width: 100%;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    margin-top: 10px;
}

/* FILTERS */

.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 20px;
    scrollbar-width: none;
}

.filter {
    padding: 9px 15px;
    border-radius: 10px;
    background: var(--card);
    color: var(--muted);
    white-space: nowrap;
    font-size: 12px;
    border: 1px solid var(--border);
}

.filter.active {
    background: #302744;
    color: var(--accent);
    border-color: #51416e;
}

/* EDIT / DELETE */

.action-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.action-row button {
    flex: 1;
}

.delete-button {
    color: var(--red);
    border-color: #503033;
}

/* BOTTOM SPACE */

@media (max-width: 360px) {
    .app {
        padding-left: 15px;
        padding-right: 15px;
    }

    .greeting h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<main class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="logo">task<span>ly.</span></div>
        <div class="avatar">U</div>
    </header>

    <!-- GREETING -->
    <section class="greeting">
        <div class="date">ПЯТНИЦА, 20 НОЯБРЯ</div>
        <h1>Привет! 👋</h1>
        <p>Давай сделаем этот день продуктивным.</p>
    </section>

    <!-- STATISTICS -->
    <section class="stats">

        <div class="stat-card">
            <div class="stat-label">Всего задач</div>
            <div class="stat-number">12</div>
        </div>

        <div class="stat-card completed">
            <div class="stat-label">Выполнено</div>
            <div class="stat-number">8</div>
        </div>

    </section>

    <!-- TODAY TASKS -->
    <section>
        <div class="section-header">
            <h2>Мои задачи</h2>
            <a href="#all">Все задачи →</a>
        </div>

        <div class="tasks">

            <article class="task">
                <div class="task-check"></div>

                <div class="task-content">
                    <div class="task-title">Изучить JavaScript</div>
                    <div class="task-description">
                        Пройти урок по DOM
                    </div>
                    <div class="task-meta">
                        <span class="priority">Высокий</span>
                        <span class="task-time">14:00</span>
                    </div>
                </div>

                <div class="task-menu">···</div>
            </article>

            <article class="task">
                <div class="task-check"></div>

                <div class="task-content">
                    <div class="task-title">Сделать домашку</div>
                    <div class="task-description">
                        Математика и английский
                    </div>
                    <div class="task-meta">
                        <span class="priority"
                        style="background:#292b38;color:#9ca7ff">
                            Средний
                        </span>
                        <span class="task-time">16:30</span>
                    </div>
                </div>

                <div class="task-menu">···</div>
            </article>

            <article class="task done">
                <div class="task-check"></div>

                <div class="task-content">
                    <div class="task-title">Утренняя зарядка</div>
                    <div class="task-description">
                        15 минут активности
                    </div>
                    <div class="task-meta">
                        <span class="task-time">Выполнено</span>
                    </div>
                </div>

                <div class="task-menu">···</div>
            </article>

        </div>
    </section>

    <!-- ADD TASK BUTTON -->
    <button class="add-button" type="button">
        <span>＋</span>
        Добавить задачу
    </button>

</main>

</body>
<script>
    const tg = window.Telegram.WebApp;

    tg.ready();

    console.log("Telegram подключён:", !!tg);
    console.log("initData получен:", !!tg.initData);
</script>
</html>
